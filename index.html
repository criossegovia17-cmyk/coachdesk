<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>CoachDesk</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<section id="login">
  <form id="lform" class="dlg">
    <div class="brand"><span class="logo">⚡</span>CoachDesk</div>
    <p class="mute">Clientes, programas, nutrición, pagos y entrenamiento grupal con IA, todo en un solo lugar.</p>
    <h2 id="ltitle">Entrar</h2>
    <label class="fl">Correo</label><input id="lemail" type="email" required autocomplete="email">
    <label class="fl">Contraseña (mínimo 6 caracteres)</label><input id="lpass" type="password" required minlength="6" autocomplete="current-password">
    <div class="bar"><button class="pri" id="lsubmit">Entrar</button><a href="#" id="lswitch">Crear cuenta</a><span class="grow"></span><a href="#" id="lreset">Olvidé mi contraseña</a></div>
    <p id="lmsg"></p>
  </form>
</section>
<button id="burger" aria-label="Menú">☰ &nbsp;CoachDesk</button>
<aside id="nav"></aside>
<main id="main"></main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
